server:
  port: 8080
  servlet:
    context-path: /cms
spring:
  application:
    name: SmashHub
  config:
    import:
      - optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/badminton_shop}}
    username: ${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:root}}
    password: ${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:root}}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  servlet:
    multipart:
      enabled: true
      # Giới hạn kích thước 1 file upload (phải khớp với MAX_FILE_SIZE trong FileServiceImpl = 5 MB).
      max-file-size: 5MB
      # Giới hạn toàn bộ request multipart (dư chút cho metadata form).
      max-request-size: 10MB
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:${SPRING_MAIL_USERNAME:thanhlongbc28@gmail.com}}
    password: ${MAIL_PASSWORD:${SPRING_MAIL_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:root}

jwt:
  signerKey: ${JWT_SIGNER_KEY:${JWT_SIGNERKEY:default_secret_signer_key_must_be_overridden_in_env_file_123456}}

google:
  client-id: ${GOOGLE_CLIENT_ID:}
  client-secret: ${GOOGLE_CLIENT_SECRET:}

app:
  otp:
    expiration-minutes: 5
    resend-cooldown-seconds: 60
  login:
    max-failed-attempts: 5
    failure-window-minutes: 15
    lockout-minutes: 15

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  # Thư mục gốc trên Cloudinary. Các sub-folder (products/, brands/, reviews/)
  # được ghép tự động bởi FileFolder.resolve(rootFolder).
  folder: ${CLOUDINARY_FOLDER:smashhub}

  order:
    expire-cron: ${ORDER_EXPIRE_CRON:0 * * * * ?}

# [MỚI] Cấu hình Giao Hàng Nhanh (GHN) API
ghn:
  base-url: ${GHN_BASE_URL:https://dev-online-gateway.ghn.vn/shiip/public-api}
  token: ${GHN_TOKEN:sample_ghn_token}
  shop-id: ${GHN_SHOP_ID:123456}
  from-district-id: ${GHN_FROM_DISTRICT_ID:1442}
  from-ward-code: ${GHN_FROM_WARD_CODE:20101}
  default-weight-gram: ${GHN_DEFAULT_WEIGHT:500}
  default-length-cm: ${GHN_DEFAULT_LENGTH:30}
  default-width-cm: ${GHN_DEFAULT_WIDTH:20}
  default-height-cm: ${GHN_DEFAULT_HEIGHT:10}
  webhook-token: ${GHN_WEBHOOK_TOKEN:ghn_webhook_secret_key}
  sync-cron: ${GHN_SYNC_CRON:0 0 3 * * ?}

# [MỚI] Cấu hình Cổng thanh toán VNPay
vnpay:
  tmn-code: ${VNPAY_TMN_CODE:DEMOVNPAY}
  hash-secret: ${VNPAY_HASH_SECRET:DEMOVNPAYSECRETKEY1234567890ABCDEF}
  pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  api-url: ${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
  return-url: ${VNPAY_RETURN_URL:http://localhost:3000/payment/vnpay/return}
  expire-minutes: ${VNPAY_EXPIRE_MINUTES:15}

# Cấu hình Real-time Chat Module (SmashHub Support)
smashhub:
  chat:
    allowed-origins:
      - ${CHAT_ALLOWED_ORIGIN_1:http://localhost:3000}
      - ${CHAT_ALLOWED_ORIGIN_2:http://localhost:5173}
      - ${CHAT_ALLOWED_ORIGIN_3:http://localhost:8080}
      - ${CHAT_ALLOWED_ORIGIN_4:http://localhost:8443}
      - ${CHAT_ALLOWED_ORIGIN_5:http://localhost:*}
    cluster:
      enable-redis-pubsub: ${CHAT_CLUSTER_REDIS:false} # Bật true khi chạy cụm nhiều instance Spring Boot (dùng Redis Pub/Sub, không cần RabbitMQ)
      redis-channel: smashhub:chat:cluster:broadcast
    rate-limit:
      max-messages: 15
      window-seconds: 10
    attachment:
      max-uploads-per-minute: 5

  # ============================================================================
  # CẤU HÌNH TRỢ LÝ AI & QUẢN TRỊ CHI PHÍ / QUOTA GEMINI (SmashHub AI)
  # ============================================================================
  ai:
    enabled: ${AI_ENABLED:true}
    api-key: ${GEMINI_API_KEY:}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    chat-model: ${GEMINI_CHAT_MODEL:gemini-flash-lite-latest}
    embedding-model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}

    # 1. Giới hạn toàn cục theo Model (RPM, TPM, RPD) - Mặc định đệm an toàn 20% dưới quota Google AI Studio
    limits:
      gemini-flash-lite-latest:
        rpm: ${AI_FLASH_RPM:15}
        tpm: ${AI_FLASH_TPM:1000000}
        rpd: ${AI_FLASH_RPD:1500}
      gemini-1.5-flash:
        rpm: ${AI_FLASH_RPM:12}          # Quota thật 15 -> Cấu hình 12 (đệm an toàn 20%)
        tpm: ${AI_FLASH_TPM:800000}      # Quota thật 1,000,000 -> Cấu hình 800,000
        rpd: ${AI_FLASH_RPD:1200}        # Quota thật 1,500 -> Cấu hình 1,200
      gemini-1.5-pro:
        rpm: ${AI_PRO_RPM:2}             # Quota thật 2 RPM
        tpm: ${AI_PRO_TPM:25000}         # Quota thật 32,000 TPM
        rpd: ${AI_PRO_RPD:40}            # Quota thật 50 RPD
      gemini-embedding-001:
        rpm: ${AI_EMBED_RPM:1200}
        tpm: ${AI_EMBED_TPM:800000}
        rpd: ${AI_EMBED_RPD:10000}
      text-embedding-004:
        rpm: ${AI_EMBED_RPM:1200}        # Quota thật 1,500 RPM
        tpm: ${AI_EMBED_TPM:800000}      # Quota thật 1,000,000 TPM
        rpd: ${AI_EMBED_RPD:10000}

    # 2. Giới hạn cá nhân theo từng Khách hàng
    user-limits:
      rpm: ${AI_USER_RPM:5}              # Tối đa 5 câu hỏi AI / phút / user
      rpd: ${AI_USER_RPD:30}             # Tối đa 30 câu hỏi AI / ngày / user

    # 3. Ngân sách chi phí và ngưỡng cảnh báo theo ngày
    budget:
      daily-limit-usd: ${AI_DAILY_BUDGET_USD:2.00}
      input-cost-per-million: 0.075     # $0.075 / 1M input tokens (Gemini 1.5 Flash)
      output-cost-per-million: 0.300    # $0.300 / 1M output tokens (Gemini 1.5 Flash)
      warning-threshold-percent: 80.0   # Cảnh báo khi đạt 80% ngân sách
      cutoff-threshold-percent: 100.0   # Tự động ngắt AI chuyển HUMAN khi đạt 100%

    # 4. Hàng đợi có giới hạn trên ThreadPoolTaskExecutor riêng biệt
    executor:
      core-pool-size: ${AI_CORE_POOL_SIZE:4}
      max-pool-size: ${AI_MAX_POOL_SIZE:8}
      queue-capacity: ${AI_QUEUE_CAPACITY:50}
      keep-alive-seconds: 60

    # 5. Retry có kiểm soát (Chỉ retry khi 429/503/timeout, tôn trọng retryDelay)
    retry:
      max-attempts: 2
      backoff-millis: 1000
      max-backoff-millis: 4000
      jitter-factor: 0.25

    # 6. Circuit Breaker (Resilience4j)
    circuit-breaker:
      sliding-window-size: 10
      failure-rate-threshold: 50.0
      wait-duration-in-open-state-seconds: 30
      permitted-number-of-calls-in-half-open-state: 3

    # 7. Cache TTL
    cache:
      faq-ttl-seconds: 86400            # Cache câu trả lời FAQ trong 24 giờ
      embedding-ttl-seconds: 604800     # Cache vector embedding trong 7 ngày

    # 8. Ước lượng Token đầu vào
    token-estimation:
      chars-per-token: 0.35             # ~1 ký tự = 0.35 token cho tiếng Việt

    # 9. RAG Catalog & Kiến thức tĩnh (Phase 1 & 2)
    rag:
      max-context-products: 3
      max-context-orders: 2
      similarity-threshold: 0.50
      max-history-messages: 6
      max-recommended-products: 3
    vectorstore:
      file-path: ${AI_VECTORSTORE_FILE_PATH:data/vectorstore.json}

    # 10. Tool Calling & Tư vấn Sản phẩm (Phase 2)
    tools:
      max-iterations: ${AI_TOOLS_MAX_ITERATIONS:3}
      max-llm-calls-per-answer: ${AI_MAX_LLM_CALLS_PER_ANSWER:4}
      search-cache-ttl-seconds: ${AI_SEARCH_CACHE_TTL:300}
    sync:
      product-cron: ${AI_PRODUCT_SYNC_CRON:0 0 2 * * ?}

    # 11. Handoff nâng cao & Quản trị nhạy cảm (Phase 3)
    handoff:
      consecutive-uncertain-threshold: ${AI_HANDOFF_UNCERTAIN_THRESHOLD:2}
      uncertain-cache-ttl-seconds: ${AI_HANDOFF_UNCERTAIN_TTL:3600}

    # 12. Admin Copilot (Phase 3)
    copilot:
      rate-limit-rpm: ${AI_COPILOT_RPM:10}
      max-draft-variants: ${AI_COPILOT_MAX_VARIANTS:2}
